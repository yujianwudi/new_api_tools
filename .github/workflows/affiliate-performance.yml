name: Affiliate performance acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affiliate-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affiliate-performance:
    name: 100k-user SQLite p95 and query-plan gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Run affiliate performance acceptance
        working-directory: backend
        env:
          AFFILIATE_PERF: '1'
        run: >-
          go test ./internal/service
          -run '^TestAffiliateStatsPerformanceAcceptance$'
          -count=1
          -v
          -timeout 10m
