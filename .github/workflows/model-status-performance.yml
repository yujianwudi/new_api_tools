name: Model status performance acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  model-status-performance:
    name: Authenticated status and durable config p95
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Run model status performance acceptance
        working-directory: backend
        run: |
          set -euo pipefail
          test_name='TestModelStatusPerformanceSLO'
          selected="$(go test -tags=performance -list "^${test_name}$" ./internal/handler)"
          grep -Fxq -- "$test_name" <<<"$selected"
          go test -tags=performance -run "^${test_name}$" -count=1 -v ./internal/handler
