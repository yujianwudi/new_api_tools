name: User management performance SLO

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  user-management-performance:
    name: 100k users and 30-day billing-log SLO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Enforce user-management latency SLOs
        working-directory: backend
        run: |
          set -euo pipefail
          test_name='TestUserManagementPerformanceSLO'
          selected="$(go test -tags=performance -list "^${test_name}$" ./internal/service)"
          grep -Fxq -- "$test_name" <<<"$selected"
          go test -tags=performance -run "^${test_name}$" -count=1 -v ./internal/service
